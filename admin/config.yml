backend:
  name: git-gateway
  branch: main

media_folder: "images/gallery"
public_folder: "/images/gallery"

collections:
  - name: "gallery"
    label: "Gallery Photos"
    files:
      - file: "data/gallery.json"
        label: "Gallery"
        name: "gallery"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            summary: "{{category}} — {{alt}}"
            fields:
              - { label: "Photo", name: "src", widget: "image" }
              - { label: "Description (helps search & accessibility)", name: "alt", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Birthday", value: "birthday" }
                  - { label: "Wedding", value: "wedding" }
                  - { label: "Corporate", value: "corporate" }
                  - { label: "Baby Shower", value: "babyshower" }

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "data/settings.json"
        label: "Contact & Location"
        name: "settings"
        fields:
          - { label: "WhatsApp Number (country code + number, no spaces or +)", name: "whatsappNumber", widget: "string" }
          - { label: "Phone Number (shown on site)", name: "phoneNumber", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram Profile URL", name: "instagramUrl", widget: "string" }
          - { label: "Instagram Handle (e.g. @balloonhouse25)", name: "instagramHandle", widget: "string" }
          - { label: "Current Location (City, State)", name: "location", widget: "string" }
