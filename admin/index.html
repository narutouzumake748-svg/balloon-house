<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloon House — Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%88%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-wrap">
    <h1 class="admin-title">🎈 Balloon House Admin</h1>

    <section id="loginSection" class="admin-card">
      <h2>Log In</h2>
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
      </div>
      <button id="loginBtn" class="btn btn-primary">Log In</button>
      <p id="loginError" class="admin-error"></p>
    </section>

    <section id="panelSection" class="admin-card" hidden>
      <div class="admin-topbar">
        <span id="loggedInAs"></span>
        <button id="logoutBtn" class="btn btn-secondary">Log Out</button>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab-btn active" data-tab="gallery">Gallery Photos</button>
        <button class="admin-tab-btn" data-tab="settings">Site Settings</button>
      </div>

      <div id="galleryTab" class="admin-tab-panel">
        <h3>Add a Photo</h3>
        <div class="form-group">
          <label for="photoFile">Choose photo (from phone or computer)</label>
          <input type="file" id="photoFile" accept="image/*">
        </div>
        <div class="form-group">
          <label for="photoAlt">Short description</label>
          <input type="text" id="photoAlt" placeholder="e.g. Pastel birthday balloon arch">
        </div>
        <div class="form-group">
          <label for="photoCategory">Category</label>
          <select id="photoCategory">
            <option value="birthday">Birthday</option>
            <option value="wedding">Wedding</option>
            <option value="corporate">Corporate</option>
            <option value="babyshower">Baby Shower</option>
          </select>
        </div>
        <button id="uploadBtn" class="btn btn-whatsapp">Upload Photo</button>
        <p id="uploadStatus" class="admin-status"></p>

        <h3>Current Photos</h3>
        <div id="adminGalleryGrid" class="admin-gallery-grid"></div>
      </div>

      <div id="settingsTab" class="admin-tab-panel" hidden>
        <div class="form-group">
          <label for="s_whatsappNumber">WhatsApp Number (country code + number, no spaces or +)</label>
          <input type="text" id="s_whatsappNumber">
        </div>
        <div class="form-group">
          <label for="s_phoneNumber">Phone Number (shown on site)</label>
          <input type="text" id="s_phoneNumber">
        </div>
        <div class="form-group">
          <label for="s_email">Email</label>
          <input type="text" id="s_email">
        </div>
        <div class="form-group">
          <label for="s_instagramUrl">Instagram Profile URL</label>
          <input type="text" id="s_instagramUrl">
        </div>
        <div class="form-group">
          <label for="s_instagramHandle">Instagram Handle (e.g. @balloonhouse25)</label>
          <input type="text" id="s_instagramHandle">
        </div>
        <div class="form-group">
          <label for="s_location">Current Location (City, State)</label>
          <input type="text" id="s_location">
        </div>
        <button id="saveSettingsBtn" class="btn btn-whatsapp">Save Settings</button>
        <p id="settingsStatus" class="admin-status"></p>
      </div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
